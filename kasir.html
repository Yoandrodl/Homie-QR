<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Homie QR - Kasir</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Styling khusus Cart & Autocomplete */
    .autocomplete-items { position: absolute; border: 1px solid #d4d4d4; border-bottom: none; border-top: none; z-index: 99; top: 100%; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 4px; }
    .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid #d4d4d4; font-size: 14px;}
    .autocomplete-items div:hover { background-color: #e9e9e9; }
    
    #cartTable td { padding: 8px 5px; border-bottom: 1px solid #edf2f7; }
    .cart-item-name { font-weight: 600; color: #2d3748; }
    .cart-item-desc { font-size: 11px; color: #718096; }
    .btn-remove { background: #fc8181; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    
    /* MODAL */
    .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.5); }
    .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 90%; max-width: 400px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2 style="margin:0;">Homie Kasir</h2>
      <a href="#" id="back-link" style="color: #4fd1c5; text-decoration: none; font-weight: 600; font-size: 14px; padding: 6px 12px; background: rgba(79, 209, 197, 0.1); border-radius: 6px;">Kembali</a>
    </div>

    <div id="loading" style="text-align: center; padding: 40px; color: #718096;">
      ⏳ Memuat database...
    </div>

    <div class="card" id="form-card" style="display: none;">
      
      <div class="form-group" style="position: relative;">
        <label>Nama Pelanggan (Ketik untuk mencari)</label>
        <input type="text" id="custName" placeholder="Contoh: Budi" autocomplete="off">
        <div id="cust-autocomplete-list" class="autocomplete-items"></div>
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label>No WhatsApp</label>
        <input type="tel" id="custWA" placeholder="0812...">
      </div>

      <!-- CARI LAYANAN -->
      <div class="form-group" style="position: relative; margin-top: 20px; padding-top: 15px; border-top: 1px dashed #cbd5e0;">
        <label>Cari & Tambah Layanan</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="serviceSearch" placeholder="Ketik nama layanan..." autocomplete="off" style="flex: 1;">
          <button id="btn-custom-item" class="btn btn-secondary" style="width: auto; padding: 12px;">+ Manual</button>
        </div>
        <div id="service-autocomplete-list" class="autocomplete-items"></div>
      </div>

      <!-- KERANJANG -->
      <div class="form-group" style="margin-top: 15px;">
        <label>Keranjang Pesanan</label>
        <div style="background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;">
          <table style="width: 100%; border-collapse: collapse; font-size: 13px;" id="cartTable">
            <thead>
              <tr style="border-bottom: 2px solid #cbd5e0;">
                <th style="text-align: left; padding-bottom: 5px;">Layanan</th>
                <th style="text-align: right; padding-bottom: 5px;">Harga</th>
                <th style="text-align: center; padding-bottom: 5px; width: 30px;"></th>
              </tr>
            </thead>
            <tbody id="cartBody">
              <tr id="emptyCartRow"><td colspan="3" style="text-align: center; padding: 15px; color: #a0aec0;">Keranjang kosong</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- ONGKIR & DISKON -->
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <div class="form-group" style="flex: 1;">
          <label>Diskon (Rp)</label>
          <input type="number" id="diskonInput" placeholder="0" value="0">
        </div>
        <div class="form-group" style="flex: 1;">
          <label>Ongkir (Rp)</label>
          <input type="number" id="ongkirInput" placeholder="0" value="0">
        </div>
      </div>

      <div class="form-group" style="margin-top: 10px;">
        <label>Catatan Khusus (Opsional)</label>
        <input type="text" id="orderNote" placeholder="Misal: Jangan disetrika, dll">
      </div>

      <!-- GRAND TOTAL -->
      <div class="total-box">
        <div style="font-size: 12px; color: #718096; font-weight: 600;">GRAND TOTAL</div>
        <div class="total-price" id="totalDisplay">Rp 0</div>
        <div id="kiloanNote" style="font-size: 12px; color: #e53e3e; margin-top: 8px; display: none;">*Ada item Kiloan: Total belum termasuk harga timbangan!</div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <label>Status Pembayaran</label>
        <select id="paymentStatus" style="background: #fff5f5; border-color: #feb2b2;" onchange="this.style.background = this.value === 'Belum Bayar' ? '#fff5f5' : '#f0fff4'; this.style.borderColor = this.value === 'Belum Bayar' ? '#feb2b2' : '#9ae6b4';">
          <option value="Belum Bayar">❌ Belum Bayar</option>
          <option value="Lunas (Tunai)">💵 LUNAS (Tunai)</option>
          <option value="Lunas (Transfer)">🏦 LUNAS (Transfer)</option>
          <option value="Lunas (QRIS)">📱 LUNAS (QRIS)</option>
        </select>
      </div>

      <button id="submit-btn" class="btn btn-success">🧾 Buat Pesanan & Cetak Nota</button>
    </div>

    <div class="card" id="result-box" style="display: none; text-align: center;">
      <h3 style="color: #27ae60; margin-top:0; font-size: 22px;">Pesanan Berhasil! 🎉</h3>
      <p style="margin-bottom: 5px;">Order ID:</p>
      <div class="order-id" id="display-order-id" style="font-size: 24px; font-weight: bold; margin-bottom: 20px;"></div>
      
      <a href="#" id="wa-link" target="_blank" class="btn" style="background: #25D366; color: white; margin-bottom: 10px; text-decoration: none;">💬 Kirim Nota ke WhatsApp</a>
      <a href="#" id="view-nota-btn" target="_blank" class="btn btn-secondary" style="margin-bottom: 10px; text-decoration: none;">📄 Buka Nota Digital</a>
      
      <div id="qr-code" style="margin: 20px 0; display: flex; justify-content: center;"></div>
      
      <button id="new-btn" class="btn btn-secondary" style="margin-top: 20px;">Buat Pesanan Lain</button>
    </div>
    <div class="nav">
      <a href="kanban.html" class="btn btn-secondary" style="display: block; text-align: center; margin-top: 20px; text-decoration: none;">📊 Lihat Laporan Operasional</a>
    </div>

  </div>

  <!-- MODAL MANUAL ITEM -->
  <div id="customItemModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Tambah Item Manual</h3>
      <div class="form-group">
        <label>Nama Item / Biaya</label>
        <input type="text" id="customName" placeholder="Misal: Biaya Jahit">
      </div>
      <div class="form-group">
        <label>Harga Total (Rp)</label>
        <input type="number" id="customPrice" placeholder="50000">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="btn-cancel-custom" class="btn btn-secondary" style="flex:1;">Batal</button>
        <button id="btn-add-custom" class="btn btn-success" style="flex:1;">Tambah</button>
      </div>
    </div>
  </div>

  <!-- MODAL QTY ITEM SATUAN -->
  <div id="qtyItemModal" class="modal">
    <div class="modal-content">
      <h3 style="margin-top:0;" id="qtyModalTitle">Masukkan Jumlah</h3>
      <div class="form-group">
        <label>Jumlah (Satuan / Meter)</label>
        <input type="number" id="qtyItemInput" value="1" min="1">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button id="btn-cancel-qty" class="btn btn-secondary" style="flex:1;">Batal</button>
        <button id="btn-add-qty" class="btn btn-success" style="flex:1;">Tambahkan</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwmVsqTzRc1kHwbjarDIU7p_ghxPiDgVHBM_Bds1p-4FYEOWrL1s1wkLriH-x4TD_M56A/exec";
    
    const role = localStorage.getItem('homie_role');
    const picName = localStorage.getItem('homie_name') || "Kasir";

    if (!role || (role !== 'Admin' && role !== 'Kasir' && role !== 'Keuangan')) {
      window.location.href = "index.html";
    }

    const backBtn = document.getElementById('back-link');
    if (role === 'Kasir' || role === 'Keuangan') {
      backBtn.textContent = 'Logout';
      backBtn.style.background = '#e53e3e';
      backBtn.style.color = '#fff';
    }

    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (role === 'Admin') window.location.href = "admin.html";
      else { localStorage.clear(); window.location.href = "index.html"; }
    });

    let customersDB = [];
    let servicesDB = [];
    let cart = []; // Array of { name, price, qty, isKiloan, type, basePrice }

    // Load Data
    Promise.all([
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'get_customers' }) }).then(r => r.json()),
      fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'get_services' }) }).then(r => r.json())
    ]).then(([custRes, servRes]) => {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('form-card').style.display = 'block';

      if (custRes.status === 'success') {
        customersDB = custRes.data;
        autocomplete(document.getElementById("custName"), customersDB);
      }
      if (servRes.status === 'success') {
        servicesDB = servRes.data;
        serviceAutocomplete(document.getElementById("serviceSearch"), servicesDB);
      }
    }).catch(err => {
      document.getElementById('loading').textContent = "Gagal memuat database.";
    });

    // --- AUTOCOMPLETE CUSTOMER ---
    function autocomplete(inp, arr) {
      let currentFocus;
      inp.addEventListener("input", function(e) {
          let a, b, i, val = this.value;
          closeAllLists();
          if (!val) { return false;}
          currentFocus = -1;
          a = document.createElement("DIV");
          a.setAttribute("id", this.id + "autocomplete-list");
          a.setAttribute("class", "autocomplete-items");
          this.parentNode.appendChild(a);
          let count = 0;
          for (i = 0; i < arr.length; i++) {
            if (arr[i].nama && arr[i].nama.toLowerCase().includes(val.toLowerCase()) && count < 10) {
              count++;
              b = document.createElement("DIV");
              let alamatText = arr[i].alamat ? " - " + arr[i].alamat : "";
              b.innerHTML = "<strong>" + arr[i].nama + "</strong><br><small>" + arr[i].wa + alamatText + "</small>";
              b.innerHTML += "<input type='hidden' value='" + arr[i].nama + "'>";
              b.innerHTML += "<input type='hidden' value='" + arr[i].wa + "'>";
              b.addEventListener("click", function(e) {
                  inp.value = this.getElementsByTagName("input")[0].value;
                  document.getElementById("custWA").value = this.getElementsByTagName("input")[1].value;
                  closeAllLists();
              });
              a.appendChild(b);
            }
          }
      });
      inp.addEventListener("keydown", function(e) {
          let x = document.getElementById(this.id + "autocomplete-list");
          if (x) x = x.getElementsByTagName("div");
          if (e.keyCode == 40) { currentFocus++; addActive(x); }
          else if (e.keyCode == 38) { currentFocus--; addActive(x); }
          else if (e.keyCode == 13) {
            e.preventDefault();
            if (currentFocus > -1) { if (x) x[currentFocus].click(); }
          }
      });
      function addActive(x) {
        if (!x) return false;
        removeActive(x);
        if (currentFocus >= x.length) currentFocus = 0;
        if (currentFocus < 0) currentFocus = (x.length - 1);
        x[currentFocus].style.backgroundColor = "#e9e9e9";
      }
      function removeActive(x) {
        for (let i = 0; i < x.length; i++) {
          x[i].style.backgroundColor = "";
        }
      }
      function closeAllLists(elmnt) {
        let x = document.getElementsByClassName("autocomplete-items");
        for (let i = 0; i < x.length; i++) {
          if (elmnt != x[i] && elmnt != inp) {
            x[i].parentNode.removeChild(x[i]);
          }
        }
      }
      document.addEventListener("click", function (e) { closeAllLists(e.target); });
    }

    // --- AUTOCOMPLETE SERVICE ---
    let pendingServiceToAdd = null;

    function serviceAutocomplete(inp, arr) {
      let currentFocus;
      inp.addEventListener("input", function(e) {
          let a, b, i, val = this.value;
          closeAllListsService();
          if (!val) { return false;}
          currentFocus = -1;
          a = document.createElement("DIV");
          a.setAttribute("id", this.id + "autocomplete-list");
          a.setAttribute("class", "autocomplete-items");
          this.parentNode.appendChild(a);
          let count = 0;
          for (i = 0; i < arr.length; i++) {
            if (arr[i].nama && arr[i].nama.toLowerCase().includes(val.toLowerCase()) && count < 20) {
              count++;
              b = document.createElement("DIV");
              b.innerHTML = "<strong>" + arr[i].nama + "</strong><br><small style='color: #4fd1c5;'>" + arr[i].tipe + "</small> - <small>Rp " + parseInt(arr[i].harga).toLocaleString('id-ID') + "</small>";
              
              let currentItem = arr[i];
              b.addEventListener("click", function(e) {
                  inp.value = "";
                  closeAllListsService();
                  handleAddService(currentItem);
              });
              a.appendChild(b);
            }
          }
      });
      function closeAllListsService(elmnt) {
        let x = document.getElementsByClassName("autocomplete-items");
        for (let i = 0; i < x.length; i++) {
          if (elmnt != x[i] && elmnt != inp && x[i].id === "serviceSearchautocomplete-list") {
            x[i].parentNode.removeChild(x[i]);
          }
        }
      }
      document.addEventListener("click", function (e) { closeAllListsService(e.target); });
    }

    function handleAddService(service) {
      if (service.tipe.toLowerCase() === 'kiloan') {
        // Langsung masuk keranjang, harga 0 (menunggu timbang)
        cart.push({
          name: service.nama,
          price: 0,
          qty: 1,
          isKiloan: true,
          type: service.tipe,
          basePrice: service.harga
        });
        renderCart();
      } else {
        // Tampilkan modal qty untuk satuan/meteran
        pendingServiceToAdd = service;
        document.getElementById('qtyModalTitle').textContent = service.nama;
        document.getElementById('qtyItemInput').value = 1;
        document.getElementById('qtyItemModal').style.display = "block";
      }
    }

    // Modal Qty Logic
    document.getElementById('btn-cancel-qty').addEventListener('click', () => {
      document.getElementById('qtyItemModal').style.display = "none";
      pendingServiceToAdd = null;
    });

    document.getElementById('btn-add-qty').addEventListener('click', () => {
      if (pendingServiceToAdd) {
        let q = parseInt(document.getElementById('qtyItemInput').value) || 1;
        let totPrice = pendingServiceToAdd.harga * q;
        cart.push({
          name: pendingServiceToAdd.nama,
          price: totPrice,
          qty: q,
          isKiloan: false,
          type: pendingServiceToAdd.tipe,
          basePrice: pendingServiceToAdd.harga
        });
        renderCart();
      }
      document.getElementById('qtyItemModal').style.display = "none";
      pendingServiceToAdd = null;
    });

    // Custom Item Modal Logic
    document.getElementById('btn-custom-item').addEventListener('click', () => {
      document.getElementById('customItemModal').style.display = "block";
      document.getElementById('customName').value = "";
      document.getElementById('customPrice').value = "";
    });
    document.getElementById('btn-cancel-custom').addEventListener('click', () => {
      document.getElementById('customItemModal').style.display = "none";
    });
    document.getElementById('btn-add-custom').addEventListener('click', () => {
      const cName = document.getElementById('customName').value.trim();
      const cPrice = parseInt(document.getElementById('customPrice').value) || 0;
      if (cName) {
        cart.push({
          name: cName,
          price: cPrice,
          qty: 1,
          isKiloan: false,
          type: "Manual",
          basePrice: cPrice
        });
        renderCart();
        document.getElementById('customItemModal').style.display = "none";
      }
    });

    // Cart Rendering
    function renderCart() {
      const tbody = document.getElementById('cartBody');
      tbody.innerHTML = "";
      
      let grandTotal = 0;
      let hasKiloan = false;

      if (cart.length === 0) {
        tbody.innerHTML = '<tr id="emptyCartRow"><td colspan="3" style="text-align: center; padding: 15px; color: #a0aec0;">Keranjang kosong</td></tr>';
      } else {
        cart.forEach((item, index) => {
          if (item.isKiloan) hasKiloan = true;
          grandTotal += item.price;
          
          let tr = document.createElement('tr');
          
          let nameHtml = `<div class="cart-item-name">${item.name}</div>`;
          if (item.isKiloan) {
            nameHtml += `<div class="cart-item-desc">Menunggu ditimbang</div>`;
          } else {
            nameHtml += `<div class="cart-item-desc">${item.qty} ${item.type === 'Meteran' ? 'Meter' : 'Pcs'}</div>`;
          }

          let priceHtml = item.isKiloan ? `<span style="color:#a0aec0; font-size:11px;">Rp ${item.basePrice.toLocaleString('id-ID')}/Kg</span>` : `Rp ${item.price.toLocaleString('id-ID')}`;

          tr.innerHTML = `
            <td>${nameHtml}</td>
            <td style="text-align: right; font-weight: 600;">${priceHtml}</td>
            <td style="text-align: center;"><button class="btn-remove" onclick="removeCartItem(${index})">X</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      // Hitung Ongkir & Diskon
      const ongkir = parseInt(document.getElementById('ongkirInput').value) || 0;
      const diskon = parseInt(document.getElementById('diskonInput').value) || 0;
      
      grandTotal = grandTotal + ongkir - diskon;
      if (grandTotal < 0) grandTotal = 0;

      document.getElementById('totalDisplay').textContent = "Rp " + grandTotal.toLocaleString('id-ID');
      document.getElementById('kiloanNote').style.display = hasKiloan ? "block" : "none";
    }

    window.removeCartItem = function(index) {
      cart.splice(index, 1);
      renderCart();
    };

    document.getElementById('ongkirInput').addEventListener('input', renderCart);
    document.getElementById('diskonInput').addEventListener('input', renderCart);

    // Submit Logic
    document.getElementById('submit-btn').addEventListener('click', () => {
      const custName = document.getElementById('custName').value.trim();
      const custWA = document.getElementById('custWA').value.trim();
      const payStatus = document.getElementById('paymentStatus').value;
      const note = document.getElementById('orderNote').value.trim();
      const ongkir = parseInt(document.getElementById('ongkirInput').value) || 0;
      const diskon = parseInt(document.getElementById('diskonInput').value) || 0;
      
      if (!custName || cart.length === 0) {
        alert("Nama Pelanggan dan minimal 1 Layanan wajib diisi!");
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.textContent = "Menyimpan...";
      btn.disabled = true;

      // Calculate totals
      let totalQty = 0;
      let hasKiloan = false;
      
      cart.forEach(c => {
        if (!c.isKiloan) totalQty += c.qty;
        if (c.isKiloan) hasKiloan = true;
      });

      let grandTotal = 0;
      cart.forEach(c => grandTotal += c.price);
      grandTotal = grandTotal + ongkir - diskon;
      if (grandTotal < 0) grandTotal = 0;

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ 
          action: 'create_pos_order_v3', 
          customerName: custName,
          customerWA: custWA || "-",
          cartItems: cart,
          ongkir: ongkir,
          diskon: diskon,
          picName: picName,
          paymentStatus: payStatus,
          totalPrice: grandTotal,
          itemsCount: totalQty > 0 ? totalQty : "",
          isKiloan: hasKiloan,
          note: note
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === 'success') {
          document.getElementById('form-card').style.display = 'none';
          document.getElementById('result-box').style.display = 'block';
          document.getElementById('display-order-id').textContent = data.orderId;
          
          // Setup Nota Link
          const notaUrl = window.location.href.replace('kasir.html', '') + 'nota.html?id=' + data.orderId;
          document.getElementById('view-nota-btn').href = notaUrl;
          
          // Setup WA Link
          if (custWA) {
            let waNum = custWA;
            if (waNum.startsWith('0')) waNum = '62' + waNum.substring(1);
            const text = `Halo Kak ${custName}, ini nota digital untuk layanan laundry di Homie Laundry Samarinda. Silakan cek detail pesanan Anda pada link berikut:\n\n${notaUrl}\n\nTerima kasih!`;
            document.getElementById('wa-link').href = `https://wa.me/${waNum}?text=${encodeURIComponent(text)}`;
            document.getElementById('wa-link').style.display = 'inline-block';
          } else {
            document.getElementById('wa-link').style.display = 'none';
          }

          // Generate QR
          new QRCode(document.getElementById("qr-code"), {
            text: data.orderId, width: 200, height: 200
          });
        } else {
          alert("Gagal: " + data.message);
          btn.textContent = "🧾 Buat Pesanan & Cetak Nota";
          btn.disabled = false;
        }
      }).catch(err => {
        alert("Terjadi kesalahan koneksi.");
        btn.textContent = "🧾 Buat Pesanan & Cetak Nota";
        btn.disabled = false;
      });
    });

    document.getElementById('new-btn').addEventListener('click', () => {
      window.location.reload();
    });

  </script>
</body>
</html>
